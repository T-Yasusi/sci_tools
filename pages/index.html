<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>Science Calculation Tools</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./modal.css">
  </head>
  <body>
    <h1>TypeScriptによる科学計算ツール</h1>
    <div id="editor"></div>
    <div>
      <select id="code-template"></select>
      <button id="run">実行</button>
    </div>
    
    <h2>出力</h2>
    <div id="output"></div>

    <div id="display-wrapper" class="modal-wrapper">
      <div id="display" class="modal"></div>
    </div>

    <div id="3D-display-wrapper" class="modal-wrapper">
      <canvas id="3D-canvas" class="modal"></canvas>
    </div>
    
    <script type="module" src="/src/main.js"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

</html>
